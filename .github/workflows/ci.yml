name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0

jobs:
  lint:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build fmt-check

  windows:
    name: Test and build (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test
      - run: zig build test-tour
      - run: zig build check

  linux:
    name: Test, build and render (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install raylib's X11 and OpenGL dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev xvfb
      - run: zig build test
      - run: zig build check
      - name: Run zui's renderer and host suites
        run: xvfb-run --auto-servernum zig build conformance
      - run: zig build test-tour
      - name: Visit every screen of the tour
        run: xvfb-run --auto-servernum zig build demo -- --hidden --frames 600 --cycle 50 2>&1 | tee cycle.log && grep "diagnostics ok: true" cycle.log
      - name: Render the tour offscreen
        run: |
          for screen in welcome gallery mission_control typography light_and_depth; do
            xvfb-run --auto-servernum zig build demo -- --screenshot "$PWD/demo-$screen.png" --screen $screen
          done
      - name: Report the CPU used while idle
        run: |
          timeout 60 xvfb-run --auto-servernum zig build demo -- --measure-idle 2>&1 | grep "^idle" | tee idle.log
          echo "The tour's welcome screen, $(cat idle.log)" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the renders
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-screenshots
          path: demo*.png

  macos:
    name: Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build check
